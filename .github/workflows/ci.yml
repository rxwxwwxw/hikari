name: CI (Linux, Windows, macOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-build-and-test:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            docker_distro: all
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker_distro: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Install LDC2, DUB, and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ldc dub zlib1g-dev nodejs openssl curl tar iproute2 shellcheck python3

      - name: Build debug and release binaries
        run: |
          dub build --compiler=ldc2 --build=debug
          dub build --compiler=ldc2 --build=release

      - name: Run D unit and contract test suite
        run: dub test --compiler=ldc2

      - name: Smoke test CLI commands
        run: |
          ./bin/hikari version
          ./bin/hikari snapshot --state-dir /tmp/ci-state > /tmp/snap.json
          ./bin/hikari hardware --state-dir /tmp/ci-state > /tmp/hw.json
          python3 -c 'import json; json.load(open("/tmp/snap.json")); json.load(open("/tmp/hw.json"))'

      - name: Run browser and macOS-layout installer tests
        run: |
          node tests/browser/test_dashboard.js
          bash tests/integration/macos/test-installer.sh
          bash tests/integration/macos/test-reconciler.sh
          python3 tests/integration/macos/test-reconcile-lifecycle.py
          python3 tests/integration/macos/test-release-verification.py
          python3 tests/install/test_bootstrap.py
          python3 tests/integration/macos/test-activation.py
          python3 tests/integration/macos/test-startup.py
          python3 tests/integration/test-graceful-shutdown.py

      - name: Run shellcheck on scripts
        run: shellcheck -S warning install/*.sh tests/integration/linux/*.sh tests/integration/macos/*.sh

      - name: Caddyfile differential test against real Caddy
        shell: bash
        run: |
          # Same pinned, checksum-verified Caddy the installer uses.
          ver=$(sed -n 's/^CADDY_PINNED_VERSION="\(.*\)"/\1/p' install/install.sh)
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=$(sed -n 's/^CADDY_SHA512_LINUX_AMD64="\(.*\)"/\1/p' install/install.sh) ;;
            aarch64) arch=arm64; sha=$(sed -n 's/^CADDY_SHA512_LINUX_ARM64="\(.*\)"/\1/p' install/install.sh) ;;
          esac
          dl="$RUNNER_TEMP/caddy-dl"; mkdir -p "$dl"
          curl -fsSL -o "$dl/caddy.tgz" "https://github.com/caddyserver/caddy/releases/download/v${ver}/caddy_${ver}_linux_${arch}.tar.gz"
          echo "$sha  $dl/caddy.tgz" | sha512sum -c -
          tar -xzf "$dl/caddy.tgz" -C "$dl" caddy
          pwsh -NoProfile -File tests/integration/caddy/differential.ps1 -Caddy "$dl/caddy"

      - name: Installer test with an existing Caddy (join, repair, mode switch, uninstall)
        run: |
          bash tests/integration/linux/test-existing-caddy.sh "$RUNNER_TEMP/caddy-dl/caddy"
          python3 tests/install/test_signed_install.py --caddy "$RUNNER_TEMP/caddy-dl/caddy"

      - name: Run Linux installer, service, and container suite
        run: bash tests/integration/linux/run.sh --distro "${{ matrix.docker_distro }}"

  windows-build-and-test:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup LDC2
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build debug and release binaries
        run: |
          dub build --compiler=ldc2 --build=debug
          dub build --compiler=ldc2 --build=release

      - name: Run D unit tests
        run: dub test --compiler=ldc2

      - name: Verify release bootstrap and readiness
        shell: pwsh
        run: |
          python tests/install/test_bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/integration/macos/test-release-verification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package-bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd "dist/bootstrap/hikari-install.ps1"), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { throw ($errs | Out-String) }

      - name: PowerShell static checks
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem install/*.ps1, tests/integration/windows/*.ps1, tests/integration/caddy/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $failed = $true; $errs | ForEach-Object { Write-Error "$($f.Name):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction SilentlyContinue
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $issues = @('install', 'tests/integration/windows', 'tests/integration/caddy') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error
            }
            if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Smoke test Windows CLI & installer
        shell: pwsh
        run: |
          .\bin\hikari.exe version
          .\bin\hikari.exe snapshot --state-dir "$env:TEMP\hikari-ci" | Out-Null
          .\bin\hikari.exe hardware --state-dir "$env:TEMP\hikari-ci" | Out-Null
          .\tests\integration\windows\test-installer.ps1
          .\tests\integration\windows\test-maintenance-task.ps1

      - name: Native Windows service test (real SCM, includes Caddy-as-service gate)
        shell: pwsh
        run: |
          # Same pinned, checksum-verified Caddy the installer uses.
          $ver = (Select-String -Path install/install.ps1 -Pattern '^\$CaddyPinnedVersion = "(.+)"').Matches[0].Groups[1].Value
          $sha = (Select-String -Path install/install.ps1 -Pattern '^\$CaddySha512WinAmd64 = "(.+)"').Matches[0].Groups[1].Value
          $dl = Join-Path $env:RUNNER_TEMP "caddy-dl"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v$ver/caddy_${ver}_windows_amd64.zip" -OutFile "$dl\caddy.zip"
          $got = (Get-FileHash "$dl\caddy.zip" -Algorithm SHA512).Hash.ToLower()
          if ($got -ne $sha) { throw "Pinned Caddy SHA-512 mismatch: expected $sha got $got" }
          Expand-Archive "$dl\caddy.zip" -DestinationPath "$dl\x" -Force
          .\tests\integration\windows\test-service.ps1 -CaddyExe "$dl\x\caddy.exe" -RequireCaddy

      - name: Caddyfile differential test against real Caddy
        shell: pwsh
        run: .\tests\integration\caddy\differential.ps1 -Caddy "$env:RUNNER_TEMP\caddy-dl\x\caddy.exe"

      - name: Installer test with an existing Caddy (join, repair, mode switch, uninstall)
        shell: pwsh
        run: .\tests\integration\windows\test-existing-caddy.ps1 -CaddyExe "$env:RUNNER_TEMP\caddy-dl\x\caddy.exe"

  macos-build-and-test:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LDC2 and DUB
        run: |
          brew install ldc dub openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Build debug and release binaries
        run: |
          dub build --compiler=ldc2 --build=debug
          dub build --compiler=ldc2 --build=release

      - name: Run D unit tests and macOS smoke checks
        run: |
          dub test --compiler=ldc2
          ./bin/hikari version
          ./bin/hikari snapshot --state-dir /tmp/hikari-mac-ci > /tmp/snap.json
          ./bin/hikari hardware --state-dir /tmp/hikari-mac-ci > /tmp/hw.json
          bash tests/integration/macos/test-installer.sh
          bash tests/integration/macos/test-reconciler.sh
          python3 tests/integration/macos/test-reconcile-lifecycle.py
          python3 tests/integration/macos/test-release-verification.py
          python3 tests/install/test_bootstrap.py
          python3 tests/integration/macos/test-activation.py
          python3 tests/integration/macos/test-startup.py
          python3 tests/integration/test-graceful-shutdown.py

      - name: Validate the pinned Caddy on native macOS
        run: bash tests/integration/macos/test-caddy.sh --download-pinned

      - name: Exercise a temporary system LaunchDaemon
        run: sudo bash tests/integration/macos/test-services.sh --system-test

      - name: Exercise real installer identities and permissions
        run: sudo bash tests/integration/macos/test-system-install.sh --system-test
